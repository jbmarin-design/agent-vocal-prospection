instructions_specifiques: >-
  Les EHPAD sont des lieux de soins : si votre interlocuteur est appelé pour une urgence,
  excusez-vous et proposez de rappeler. Ne parlez jamais des résidents. Ne critiquez jamais
  le prestataire actuel. Le standard est souvent tenu par l'accueil ou le secrétariat de
  direction : soyez particulièrement courtois.
