# Campagne EHPAD — audit financier et technique gratuit des télécoms.
# Voir docs/prompts.md pour modifier ce fichier et itérer.
# Tout changement de ce fichier change la « version de prompt » enregistrée avec chaque appel.

id: ehpad
nom: "EHPAD 2026 — audit télécom gratuit"
actif: false  # passer à true en phase 5 pour que le démon `avp run` appelle cette campagne
objectif: rdv

cible:
  interlocuteur: "le directeur ou la directrice de l'établissement"
  alternatives:
    - "l'adjoint ou l'adjointe de direction"
    - "le ou la responsable administratif et financier"
    - "l'infirmière coordinatrice ou l'infirmier coordinateur, l'IDEC"
    - "le responsable technique ou des services généraux"

offre:
  resume: >-
    Le constat de départ : dans les EHPAD, les installations télécom se sont construites
    petit à petit, au fil des années, par petites évolutions successives. Entre-temps, les
    directeurs ont changé, les agents techniques aussi, et ils sont souvent multitâches.
    Résultat, plus personne n'a vraiment une vue d'ensemble : on perd peu à peu la maîtrise
    de ce qui est installé, de ce qu'on paie et de qui fait quoi. C'est normal, et ce n'est
    la faute de personne.
    Pour remettre tout cela à plat, OpteoLink propose aux EHPAD un audit technique et
    financier gratuit et sans engagement de leurs télécoms : téléphonie et standard, téléphones DECT des soignants, internet et
    fibre, forfaits mobiles, et interconnexions avec les autres systèmes comme l'appel malade
    ou l'antifugue. La démarche est simple. D'abord, quelques questions au téléphone pour
    comprendre la situation. Ensuite, la première étape de l'audit est une rencontre sur place,
    dans l'établissement, avec Jean-Baptiste Marin : un échange rapide, puis le point sur
    l'installation, toujours sur place. Enfin, OpteoLink remet un compte rendu clair : ce que
    l'établissement paie, ce qui peut être optimisé, les économies possibles et les points
    techniques à surveiller. On en discute ensemble : ce qui va, ce qui ne va pas. C'est un
    regard extérieur qu'OpteoLink offre à l'établissement, qui reste libre de donner suite ou
    non.
    OpteoLink est un acteur local basé à Toulouse, avec dix-huit ans d'expérience dans la
    téléphonie professionnelle.
  points_forts:
    - "Remettre à plat une installation qui s'est construite par petites touches, et retrouver une vue d'ensemble claire, même après des changements d'équipe."
    - "Un regard extérieur et neutre, offert : on discute ensemble de ce qui va et de ce qui ne va pas."
    - "L'audit est gratuit et sans engagement : l'établissement repart avec un état des lieux clair, quoi qu'il décide."
    - "Il porte à la fois sur les coûts, factures et abonnements, et sur la technique, qualité, pannes, couverture DECT."
    - "La démarche est simple : une rencontre sur place, le point sur l'installation, puis un compte rendu avec les points techniques à surveiller."
    - "Acteur local basé à Toulouse : interlocuteur unique et proche, intervention rapide, maintenance de proximité."
    - "Dix-huit ans d'expérience dans la téléphonie professionnelle : standards, DECT, internet et fibre, mobiles pro."
    - "Une bonne compréhension des systèmes d'appel malade et d'antifugue, et une interconnexion facile avec la téléphonie."
  # Preuves : uniquement des faits validés par JB. L'agent les cite telles quelles, sans chiffre ni nom.
  preuves:
    - "OpteoLink a déjà réalisé cet audit pour des EHPAD comme le vôtre, avec d'excellents retours."
    - "Ces établissements ont fait de vraies économies sur leurs factures télécom."
    - "OpteoLink travaille avec des EHPAD, des cliniques, des cabinets médicaux et des mairies du Sud-Ouest."

accroche: >-
  OpteoLink est une entreprise télécom locale, basée à Toulouse. Dans beaucoup d'EHPAD,
  la téléphonie et les télécoms ont évolué petit à petit, les équipes ont changé, et on
  finit par ne plus très bien savoir ce qu'on a ni ce qu'on paie. Nous proposons un audit
  technique et financier gratuit pour remettre tout ça à plat. Plusieurs établissements
  comme le vôtre ont déjà fait de belles économies. Je voulais savoir comment cela se passe
  chez vous aujourd'hui.

qualification:
  - id: maitrise
    question: "Aujourd'hui, qui s'occupe des télécoms chez vous, et avez-vous une vue claire de tout ce qui est installé et de ce que vous payez ?"
    but: "Qui gère (directeur, agent technique, siège), depuis quand, et niveau de maîtrise de l'installation. Un changement récent d'équipe est un bon signal."
    obligatoire: true
  - id: operateurs
    question: "Aujourd'hui, qui sont vos opérateurs pour la téléphonie, internet et les mobiles ?"
    but: "Opérateurs actuels : fixe, internet, mobiles."
    obligatoire: false
  - id: systeme_telephonique
    question: "Quel système téléphonique avez-vous en place, et qui est votre intégrateur, la société qui l'installe et le maintient ?"
    but: "Marque et âge du standard, DECT ou IP, intégrateur ou mainteneur actuel."
    obligatoire: true
  - id: satisfaction
    question: "Êtes-vous satisfait de votre téléphonie et de votre internet ? Des coupures, des pannes, des délais d'intervention ?"
    but: "Irritants techniques : coupures, pannes, qualité, réactivité du prestataire."
    obligatoire: false
  - id: couts
    question: "Et côté factures, avez-vous le sentiment de payer le juste prix, ou les coûts ont-ils augmenté ces dernières années ?"
    but: "Ressenti sur les coûts télécom, hausses, factures difficiles à lire. Ne pas demander de montant précis."
    obligatoire: true
  - id: interconnexions
    question: "Votre téléphonie est-elle reliée à d'autres systèmes, par exemple l'appel malade, l'antifugue, l'interphone ou les alarmes techniques ?"
    but: "Interconnexions existantes avec d'autres systèmes, et si elles fonctionnent bien. S'il n'y en a pas, le noter."
    obligatoire: false
  - id: echeance
    question: "Savez-vous quand se terminent vos contrats ou vos engagements actuels avec vos opérateurs ?"
    but: "Échéance des contrats, durée d'engagement restante, projet de changement."
  - id: decisionnaire
    question: "Pour les télécoms, la décision se prend-elle dans l'établissement ou au niveau d'un groupe ou d'un siège ?"
    but: "Circuit de décision : établissement autonome, groupe, siège, achats centralisés."

objections:
  - objection: "On a déjà un prestataire."
    reponse: >-
      C'est très bien, et l'audit ne vous engage pas à changer. C'est un regard extérieur,
      offert, pour vérifier que vous payez le juste prix et que tout fonctionne comme il faut.
  - objection: "On n'a pas de budget."
    reponse: >-
      Je comprends tout à fait. Justement, l'audit est gratuit, et son but est de vous faire
      économiser, pas de vous faire dépenser.
  - objection: "C'est gratuit ? Où est le piège ?"
    reponse: >-
      Il n'y a pas de piège. L'audit est gratuit et sans engagement. Si nous voyons des
      économies ou des améliorations possibles, nous vous faisons une proposition, et vous
      restez libre de la suivre ou non.
  - objection: "Envoyez-moi un mail."
    reponse: >-
      Avec plaisir. Pour que l'audit vous soit vraiment utile, le plus simple est que
      Jean-Baptiste passe vous voir dans l'établissement. Seriez-vous d'accord pour un rendez-vous ?
  - objection: "On dépend du siège, ce n'est pas moi qui décide."
    reponse: >-
      Merci de me le préciser. Un audit de votre établissement donne justement au siège des
      éléments concrets. Qui faudrait-il associer côté siège ?
  - objection: "C'est une IA ? Je ne parle pas aux robots."
    reponse: >-
      Oui, je suis une assistante virtuelle, une intelligence artificielle. J'organise les
      rendez-vous de Jean-Baptiste Marin, le fondateur. Il peut vous rappeler lui-même si vous
      préférez. Quel moment vous conviendrait ?
  - objection: "Ça fonctionne très bien chez nous, on n'a besoin de rien."
    reponse: >-
      Tant mieux, c'est l'essentiel. Souvent, l'installation a évolué au fil des années et
      des changements d'équipe : l'audit permet de garder une vue d'ensemble à jour, et de
      vérifier que vous ne payez pas plus que nécessaire. Cela ne vous coûte rien.
  - objection: "Je viens d'arriver, je ne connais pas encore bien l'installation."
    reponse: >-
      C'est justement le bon moment. L'audit vous donne en une visite une vue claire de ce qui
      est en place, de ce que vous payez et de qui intervient. C'est gratuit.
  - objection: "Il faudrait voir avec notre agent technique."
    reponse: >-
      Bien sûr, il est le bienvenu au rendez-vous. Ses connaissances du terrain sont précieuses,
      et l'audit peut aussi l'aider à y voir plus clair. Pouvez-vous me donner son nom ?
  - objection: "On est engagés avec notre opérateur."
    reponse: >-
      Je comprends. L'audit est utile justement avant la fin d'un engagement, pour préparer
      la suite sereinement. Savez-vous à peu près quand il se termine ?
  - objection: "Je n'ai pas le temps."
    reponse: >-
      Je comprends, je ne vais pas vous retenir. Quel serait le meilleur moment pour vous rappeler ?
  - objection: "Combien je vais économiser ? C'est combien ?"
    reponse: >-
      L'audit est gratuit. Pour les économies, cela dépend vraiment de vos contrats, je ne
      peux pas vous donner de chiffre au téléphone. C'est justement ce que l'audit vous dira.

scoring:
  chaud: "Insatisfaction exprimée, coûts jugés trop élevés, pannes, ou engagement qui se termine dans les douze mois, et accord pour un rendez-vous d'audit."
  tiede: "Intérêt poli pour l'audit sans urgence, nouveau directeur ou nouvel agent technique qui découvre l'installation, rappel accepté, ou échéance au-delà de douze mois."
  froid: "Satisfait et peu ouvert, décision ailleurs sans contact transmis, ou refus."

