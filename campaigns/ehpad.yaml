repondeur:
  action: raccrocher
  message: ""

plages:
  - jours: [1, 2, 3, 4, 5]
    debut: "10:00"
    fin: "12:30"
  - jours: [1, 2, 3, 4, 5]
    debut: "14:00"
    fin: "17:00"

max_tentatives: 3
delai_entre_tentatives_h: 48

rdv:
  duree_min: 30
  mode: "sur place, dans l'établissement"
  creneaux_proposes: 3
  delai_min_jours: 2
  horizon_jours: 15
  # RDV pris directement le mardi et le jeudi (invitation envoyée au client)
  plages:
    - jours: [2, 4]
      debut: "09:30"
      fin: "12:00"
    - jours: [2, 4]
      debut: "14:00"
      fin: "17:30"
  # Lundi et vendredi : seulement si rien ne convient, à confirmer par JB (email)
  jours_a_confirmer: [1, 5]
  creneaux_a_confirmer: 2

