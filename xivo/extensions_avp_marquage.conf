; =====================================================================================================
; Marquage des appels de l'agent vocal (mode natif XiVO)
; Destination : /etc/asterisk/extensions_extra.d/extensions_avp_marquage.conf
;
; L'agent pose sur chaque INVITE l'en-tête « X-AVP-Call-ID: <identifiant d'appel avp> » (le même que
; dans `avp calls show` et dans Axonaut). Ce sous-programme le lit et l'écrit :
;   - dans le CEL, en donnée attachée XiVO CC : ATTACHED_DATA avec avp_call_id=<id>, sur le même
;     linkedid que l'événement ATTACHED_DATA recording=<id> de l'enregistrement → le serveur
;     d'enregistrement XiVO CC peut chercher sur avp_call_id ;
;   - dans la variable héritée AVP_CALLID (disponible aussi sur le canal sortant vers l'opérateur).
;
; Branchement : une ligne en tête de [xivocc-outcall-recording] (xivocc-recording.conf, sous-routine
; de prétraitement des règles d'appel sortant) :
;   same  =   n,Gosub(avp-marquage,s,1)
; Elle s'exécute sur le canal entrant PJSIP de LiveKit, seul endroit où l'en-tête est lisible. Sans
; l'en-tête (appels des postes), le sous-programme ne fait rien.
;
; Recharger : asterisk -rx 'dialplan reload'
; =====================================================================================================

[avp-marquage]
exten => s,1,NoOp(AVP : marquage de l'appel)
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?fin)
 same => n,Set(AVP_ID=${PJSIP_HEADER(read,X-AVP-Call-ID)})
; Caractères sûrs uniquement (l'ID avp est hexadécimal, donc inchangé)
 same => n,Set(AVP_ID=${FILTER(0-9a-zA-Z_.,${AVP_ID})})
 same => n,GotoIf($["${AVP_ID}" = ""]?fin)
 same => n,Set(__AVP_CALLID=${AVP_ID})
 same => n,CELGenUserEvent(ATTACHED_DATA,avp_call_id=${AVP_ID})
 same => n,NoOp(AVP : appel ${AVP_ID} linkedid=${CHANNEL(linkedid)})
 same => n(fin),Return()
