; =====================================================================================================
; Agent vocal de prospection OpteoLink — dialplan des appels venant de LiveKit SIP
; À copier dans /etc/asterisk/extensions_extra.d/extensions_livekit.conf sur le XiVO, puis :
;     asterisk -rx 'dialplan reload'
;
; Flux : agent-worker → livekit-sip ──INVITE sip:+33612345678@<xivo>──► trunk « livekit »
;        (context=from-livekit) → contrôles → numéro présenté forcé → MixMonitor → Dial trunk opérateur
;
; Compatible chan_sip ET chan_pjsip (détection automatique du type de canal).
; Voir xivo/README.md pour la procédure complète et les tests.
;
; Règles importantes :
;   - NE PAS faire Answer() avant le Dial : LiveKit considère l'appel décroché au 200 OK. Le 200 OK
;     doit donc partir quand LE PROSPECT décroche (Asterisk relaie 180/183 puis 200).
;   - Les échecs sont renvoyés avec une cause Q.850 précise (→ 486 occupé, 480 pas de réponse,
;     404 numéro inexistant, 503 congestion) : le worker en déduit l'issue de l'appel.
; =====================================================================================================

; -----------------------------------------------------------------------------------------------------
; PARAMÈTRES — à adapter (un seul endroit)
; -----------------------------------------------------------------------------------------------------
[avp-config]
; Numéro présenté au prospect (national ou E.164 selon ce qu'accepte votre opérateur)
exten => s,1,Set(AVP_CALLERID=0587140500)
 same => n,Set(AVP_CALLERID_NAME=OpteoLink)
; Sortie opérateur existante. Mode « dial » : Dial direct sur le trunk opérateur.
;   chan_sip : SIP/<nom_trunk>/  — ex. SIP/sewan/       → Dial(SIP/sewan/0612345678)
;   PJSIP    : PJSIP/ + @<trunk> — voir AVP_DIAL_SUFFIX → Dial(PJSIP/0612345678@sewan)
 same => n,Set(AVP_ROUTE_MODE=dial)
 same => n,Set(AVP_DIAL_PREFIX=SIP/sewan/)
 same => n,Set(AVP_DIAL_SUFFIX=)
; Mode « outcall » : passage par le contexte de sortie XiVO (règles d'appels sortants, préfixes,
; présentation). Le contexte par défaut des sorties XiVO est to-extern.
 same => n,Set(AVP_OUTCALL_CONTEXT=to-extern)
; Format du numéro envoyé à l'opérateur : national (0612345678) ou e164 (+33612345678) ou intl (0033612345678)
 same => n,Set(AVP_NUMBER_FORMAT=national)
; Enregistrement (MixMonitor). Dossier créé si absent ; 1 = actif, 0 = inactif.
 same => n,Set(AVP_RECORD=1)
 same => n,Set(AVP_REC_DIR=/var/spool/asterisk/monitor/avp)
; Garde-fous : sonnerie max (s) et durée max après décroché (s) — filet de sécurité côté XiVO,
; en plus de la durée max gérée par l'agent (MAX_CALL_DURATION_S=360).
 same => n,Set(AVP_RING_TIMEOUT=45)
 same => n,Set(AVP_MAX_DURATION=420)
; Contexte XiVO dans lequel sont joignables les postes internes (transfert vers JB)
 same => n,Set(AVP_INTERNAL_CONTEXT=default)
 same => n,Return()

; -----------------------------------------------------------------------------------------------------
; CONTEXTE DU TRUNK « livekit »
; (Créer aussi le contexte « from-livekit » dans l'interface XiVO pour qu'il soit sélectionnable
;  sur le trunk : Asterisk fusionne les deux définitions ; tout passe par l'include ci-dessous.)
; -----------------------------------------------------------------------------------------------------
[from-livekit]
include => avp-from-livekit

[avp-from-livekit]
; --- Numéros français autorisés (E.164 envoyé par LiveKit) : fixes 01-05, 09 et mobiles 06/07 -------
exten => _+33[1-79]XXXXXXXX,1,NoOp(AVP : appel sortant agent vocal vers ${EXTEN})
 same => n,Gosub(avp-outbound,s,1(${EXTEN}))
 same => n,Hangup()

; Même chose si le numéro arrive au format national (tests manuels)
exten => _0[1-79]XXXXXXXX,1,Goto(avp-from-livekit,+33${EXTEN:1},1)

; Numéros surtaxés (08), courts, internationaux, urgences : REFUSÉS (cause 21 → 403)
exten => _+338.,1,NoOp(AVP : numéro 08 refusé : ${EXTEN})
 same => n,Hangup(21)
exten => _X.,1,NoOp(AVP : destination non autorisée : ${EXTEN})
 same => n,Hangup(21)
exten => _+X.,1,NoOp(AVP : destination non autorisée : ${EXTEN})
 same => n,Hangup(21)

; --- Transfert / appel interne vers un poste OpteoLink (ex. TRANSFER_TARGET=sip:1001@xivo) -----------
; Adapter le motif à votre plan de numérotation interne. Sert à l'alternative « transfert par
; second appel » (warm transfer) : l'agent appelle le poste via le même trunk.
exten => _1XXX,1,NoOp(AVP : appel interne vers le poste ${EXTEN})
 same => n,Gosub(avp-config,s,1)
 same => n,Goto(${AVP_INTERNAL_CONTEXT},${EXTEN},1)

exten => i,1,Hangup(1)

; -----------------------------------------------------------------------------------------------------
; Contexte utilisé pour le transfert aveugle (REFER) émis par LiveKit :
; Refer-To: sip:1001@<xivo> → l'interlocuteur (jambe opérateur) est envoyé vers le poste 1001.
; -----------------------------------------------------------------------------------------------------
[avp-transfer]
exten => _1XXX,1,NoOp(AVP : transfert du prospect vers le poste ${EXTEN})
 same => n,Gosub(avp-config,s,1)
 same => n,Goto(${AVP_INTERNAL_CONTEXT},${EXTEN},1)
exten => _X.,1,NoOp(AVP : transfert refusé vers ${EXTEN})
 same => n,Hangup(21)

; -----------------------------------------------------------------------------------------------------
; Sous-programme principal : ARG1 = numéro E.164 (+33…)
; -----------------------------------------------------------------------------------------------------
[avp-outbound]
exten => s,1,Gosub(avp-config,s,1)
 same => n,Set(AVP_E164=${ARG1})
; --- Identifiant d'appel : en-tête X-AVP-Call-ID posé par l'agent, sinon Call-ID SIP ----------------
 same => n,Set(AVP_CALLID=)
; (branches séparées : les fonctions PJSIP_* / SIP_* ne doivent être évaluées que sur leur type de canal)
 same => n,GotoIf($["${CHANNEL(channeltype)}" = "PJSIP"]?cid_pjsip)
 same => n,GotoIf($["${CHANNEL(channeltype)}" = "SIP"]?cid_sip:cid_end)
 same => n(cid_pjsip),Set(AVP_CALLID=${PJSIP_HEADER(read,X-AVP-Call-ID)})
 same => n,ExecIf($["${AVP_CALLID}" = ""]?Set(AVP_CALLID=sip-${CHANNEL(pjsip,call-id)}))
 same => n,Goto(cid_end)
 same => n(cid_sip),Set(AVP_CALLID=${SIP_HEADER(X-AVP-Call-ID)})
 same => n,ExecIf($["${AVP_CALLID}" = ""]?Set(AVP_CALLID=sip-${SIPCALLID}))
 same => n(cid_end),ExecIf($["${AVP_CALLID}" = ""]?Set(AVP_CALLID=uid-${UNIQUEID}))
; Caractères sûrs pour un nom de fichier uniquement (l'ID avp est hexadécimal, donc inchangé)
 same => n,Set(AVP_CALLID=${FILTER(0-9a-zA-Z_.,${AVP_CALLID})})
 same => n,Set(CDR(userfield)=avp:${AVP_CALLID})
 same => n,Set(CHANNEL(accountcode)=avp)
; --- Transfert aveugle (REFER) : le poste cible est cherché dans [avp-transfer] ---------------------
 same => n,Set(__TRANSFER_CONTEXT=avp-transfer)
; --- Numéro présenté forcé (ignore ce que LiveKit a mis dans le From) --------------------------------
 same => n,Set(CALLERID(num)=${AVP_CALLERID})
 same => n,Set(CALLERID(name)=${AVP_CALLERID_NAME})
 same => n,Set(CALLERPRES()=allowed)
; --- Format du numéro pour l'opérateur ---------------------------------------------------------------
 same => n,Set(AVP_NUM=${AVP_E164})
 same => n,ExecIf($["${AVP_NUMBER_FORMAT}" = "national" & "${AVP_E164:0:3}" = "+33"]?Set(AVP_NUM=0${AVP_E164:3}))
 same => n,ExecIf($["${AVP_NUMBER_FORMAT}" = "intl"]?Set(AVP_NUM=00${AVP_E164:1}))
; --- Enregistrement : avp/AAAAMMJJ/avp-<call_id>.wav (audio uniquement une fois en communication) -----
 same => n,GotoIf($["${AVP_RECORD}" != "1"]?route)
 same => n,Set(AVP_REC_DAY=${STRFTIME(${EPOCH},Europe/Paris,%Y%m%d)})
 same => n,System(mkdir -p ${AVP_REC_DIR}/${AVP_REC_DAY})
 same => n,Set(AVP_REC_FILE=${AVP_REC_DIR}/${AVP_REC_DAY}/avp-${AVP_CALLID}.wav)
 same => n,MixMonitor(${AVP_REC_FILE},b)
 same => n,Set(CDR(recordingfile)=${AVP_REC_FILE})
 same => n,NoOp(AVP : enregistrement ${AVP_REC_FILE})
; --- Routage vers la sortie opérateur -------------------------------------------------------------
 same => n(route),NoOp(AVP : ${AVP_CALLID} → ${AVP_NUM} présenté ${AVP_CALLERID} mode ${AVP_ROUTE_MODE})
 same => n,GotoIf($["${AVP_ROUTE_MODE}" = "outcall"]?outcall)
; Options Dial : S(x) = raccroche x s après le décroché (filet de sécurité). Pas de r (on relaie la vraie sonnerie).
 same => n,Dial(${AVP_DIAL_PREFIX}${AVP_NUM}${AVP_DIAL_SUFFIX},${AVP_RING_TIMEOUT},S(${AVP_MAX_DURATION}))
 same => n,Goto(status)
 same => n(outcall),Goto(${AVP_OUTCALL_CONTEXT},${AVP_NUM},1)
; --- Cause de fin renvoyée à LiveKit (→ code SIP) --------------------------------------------------
 same => n(status),NoOp(AVP : DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,ExecIf($["${DIALSTATUS}" = "BUSY"]?Hangup(17))
 same => n,ExecIf($["${DIALSTATUS}" = "NOANSWER"]?Hangup(19))
 same => n,ExecIf($["${DIALSTATUS}" = "CHANUNAVAIL" & "${HANGUPCAUSE}" = "1"]?Hangup(1))
 same => n,ExecIf($["${DIALSTATUS}" = "CONGESTION" & "${HANGUPCAUSE}" = "1"]?Hangup(1))
 same => n,ExecIf($["${DIALSTATUS}" = "CANCEL"]?Hangup(16))
 same => n,Hangup(34)
 same => n(done),Return()

; Trace de fin d'appel (la priorité h s'exécute dans le contexte courant, ici celui du Gosub)
exten => h,1,NoOp(AVP : fin ${AVP_CALLID} DIALSTATUS=${DIALSTATUS} cause=${HANGUPCAUSE} durée=${CDR(billsec)}s)
