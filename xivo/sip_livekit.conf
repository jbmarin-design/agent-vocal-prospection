; =====================================================================================================
; Trunk SIP statique XiVO ↔ LiveKit SIP (VM agent vocal) — RÉFÉRENCE de configuration
;
; Sur un XiVO, la méthode recommandée est l'interface web (xivo/README.md § 2) : elle génère
; l'équivalent de ce qui suit dans la configuration Asterisk. Ce fichier sert :
;   - de référence champ par champ pour vérifier ce que l'interface a produit
;     (asterisk -rx 'sip show peer livekit'  /  asterisk -rx 'pjsip show endpoint livekit') ;
;   - de configuration directe sur un Asterisk « nu » ou si vous gérez le trunk en fichier.
;
; Remplacer 10.0.0.50 par l'IP de la VM (NODE_IP de .env) partout.
; Ne garder QUE la variante correspondant au pilote SIP du XiVO :
;   asterisk -rx 'module show like chan_sip'   → chan_sip chargé   → VARIANTE A
;   asterisk -rx 'module show like pjsip'      → res_pjsip chargé  → VARIANTE B
; =====================================================================================================


; =====================================================================================================
; VARIANTE A — chan_sip   (fichier : /etc/asterisk/sip.conf ou un fichier inclus, ex. sip_livekit.conf)
; =====================================================================================================
[livekit]
type=friend                 ; reçoit les INVITE de LiveKit (sortants prospects) et peut lui en envoyer
host=10.0.0.50              ; IP de la VM agent vocal (statique, pas de REGISTER)
port=5060
transport=udp               ; doit correspondre à XIVO_SIP_TRANSPORT de .env
context=from-livekit        ; dialplan de xivo/extensions_livekit.conf
insecure=port,invite        ; pas d'authentification digest des INVITE : l'IP fait foi (filtrée par nftables + host=)
; Si vous préférez une authentification digest (SIP_TRUNK_USERNAME/PASSWORD de .env) :
;   insecure=port  +  secret=<mot de passe>  +  defaultuser=<utilisateur>  (type=friend)
disallow=all
allow=alaw                  ; G.711 A-law en premier (réseau français), µ-law en secours
allow=ulaw
dtmfmode=rfc2833            ; DTMF RFC 4733 (supporté par livekit-sip)
directmedia=no              ; le RTP passe par le XiVO (MixMonitor, NAT, opérateur) : indispensable
canreinvite=no              ; ancien nom de directmedia (versions anciennes)
nat=force_rport,comedia     ; utile si la VM est derrière un NAT (topologie « via Internet »), sans effet sinon
qualify=yes                 ; OPTIONS périodiques : « sip show peers » indique OK (xx ms)
qualifyfreq=30
allowtransfer=yes           ; accepte le REFER émis par LiveKit (transfert à chaud vers un poste)
sendrpid=no
trustrpid=no
callcounter=yes
call-limit=10               ; plafond de sécurité (MAX_CONCURRENT_CALLS=2 côté agent)
language=fr


; =====================================================================================================
; VARIANTE B — PJSIP   (fichier : /etc/asterisk/pjsip.conf ou un fichier inclus)
; Un transport UDP 0.0.0.0:5060 existe déjà sur le XiVO ; adapter « transport= » à son nom
; (asterisk -rx 'pjsip show transports').
; =====================================================================================================
;[livekit]
;type=endpoint
;transport=transport-udp
;context=from-livekit
;disallow=all
;allow=alaw,ulaw
;dtmf_mode=rfc4733
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
;rewrite_contact=yes
;allow_transfer=yes
;send_rpid=no
;trust_id_inbound=no
;language=fr
;aors=livekit
;; Authentification sortante uniquement si le XiVO doit s'authentifier auprès de LiveKit (inutile ici).
;
;[livekit]
;type=aor
;contact=sip:10.0.0.50:5060
;qualify_frequency=30
;
;[livekit]
;type=identify
;endpoint=livekit
;match=10.0.0.50            ; les INVITE venant de cette IP sont rattachés à l'endpoint livekit (≈ insecure=invite)
