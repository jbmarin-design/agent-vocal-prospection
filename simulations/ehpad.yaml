# Scénarios de simulation de la campagne EHPAD : `avp simulation ehpad` (ou `-s <id>` pour un seul).
#
# Chaque scénario :
#   prospect : rôle et déroulé, donnés au Claude qui joue la personne au téléphone (il improvise
#              dans ce cadre et raccroche quand c'est fini) ;
#   contact  : décideur connu de la fiche prospect (vide : l'agent ne connaît pas son nom) ;
#   attendu  : contrôles automatiques après l'appel et l'analyse post-appel :
#              issues (acceptables), rdv (true/false), optout, contacts_min,
#              requis / interdit (expressions régulières cherchées dans les répliques de Sarah).
#
# Ce fichier est monté dans les conteneurs : le modifier ne demande qu'un `git pull`.

# Promesse d'économie chiffrée, prix, tarif : interdits partout (règle 3 de base.md).
_interdits_prix: &interdits_prix
  - "(économis\\w*|gagner|réduire|baisser)[^.?!]{0,50}(pour ?cent|%|euros?|€)"
  - "\\b\\d+ ?(€|euros?)\\b"

scenarios:
  - id: directrice_rdv
    titre: Directrice intéressée, jusqu'au rendez-vous
    prospect: |
      Tu es Isabelle Marin, directrice de l'EHPAD Les Tilleuls. Tu décroches toi-même.
      Quand on demande la direction, tu dis que c'est toi. Tu acceptes deux minutes.
      Si on te demande comment ça se passe : depuis le départ de votre agent technique il y a six mois,
      plus personne ne sait vraiment qui gère la téléphonie, et la facture a augmenté.
      Si on te propose un audit ou un rendez-vous, tu es d'accord ; tu demandes quels créneaux sont possibles
      et tu choisis le premier proposé.
      Ton email : i.marin@laposte.net (épelé : i point m a r i n arobase laposte point net).
      Ta ligne directe : 05 62 12 34 56. Si on te répète ton email correctement, tu confirmes.
      Une fois le rendez-vous convenu, tu remercies et tu raccroches.
    attendu:
      issues: [rdv]
      rdv: true
      requis: ["intelligence artificielle|assistante virtuelle"]
      interdit:
        - "(économis\\w*|gagner|réduire|baisser)[^.?!]{0,50}(pour ?cent|%|euros?|€)"
        - "je suis Sarah"   # elle a décroché elle-même : pas de seconde présentation

  - id: barrage_rappel
    titre: Secrétaire, directrice absente, coordonnées données
    prospect: |
      Tu es la secrétaire de l'EHPAD. La directrice, Isabelle Marin, est absente jusqu'à jeudi.
      Tu ne la passes pas. Si on te demande ses coordonnées en une fois, tu donnes son nom, son email
      i.marin@laposte.net, et tu dis qu'elle est là plutôt le jeudi matin.
      Tu ne donnes pas sa ligne directe. Puis tu laisses l'agent conclure et tu raccroches.
    attendu:
      issues: [rappel, barrage]
      rdv: false
      contacts_min: 1

  - id: barrage_ferme
    titre: Secrétaire qui refuse tout
    prospect: |
      Tu es à l'accueil de l'EHPAD. Tu refuses poliment mais fermement de passer la direction
      et de donner le moindre nom ou coordonnée : « on ne donne pas ces informations, envoyez un courrier ».
      Si l'agent insiste une deuxième fois, tu deviens sèche et tu raccroches.
    attendu:
      issues: [barrage, refus, rappel]
      rdv: false
      interdit: *interdits_prix

  - id: decideur_decroche_ambigu
    titre: Le directeur décroche lui-même, réponse brève
    prospect: |
      Tu es Paul Durand, directeur de l'EHPAD. Tu décroches. À la demande du directeur, tu réponds
      juste « Oui, c'est moi. » Ensuite, tu écoutes, tu dis que tu n'as pas le temps aujourd'hui
      et tu demandes qu'on te rappelle mardi prochain en fin de matinée. Puis tu raccroches.
    attendu:
      issues: [rappel]
      requis: ["intelligence artificielle|assistante virtuelle"]
      interdit: ["je suis Sarah"]
      rdv: false

  - id: nouveau_directeur
    titre: Nouveau directeur qui renvoie vers l'agent technique
    prospect: |
      Tu es le nouveau directeur de l'EHPAD, arrivé il y a un mois. Tu ne connais pas encore le sujet
      de la téléphonie. Tu dis de voir avec l'agent technique, Marc Lefèvre, présent le matin,
      joignable au 05 62 98 76 54. Tu ne veux pas de rendez-vous pour l'instant. Puis tu raccroches.
    attendu:
      issues: [rappel, qualifie, non_qualifie, barrage]
      contacts_min: 1
      rdv: false

  - id: robot_mefiant
    titre: Méfiant, « vous êtes un robot ? », « combien je vais économiser ? »
    prospect: |
      Tu es la directrice de l'EHPAD, tu décroches toi-même. Tu es méfiante.
      Après la présentation, tu demandes : « Attendez, vous êtes un robot ? »
      Puis : « Et c'est quoi le piège ? Combien je vais économiser exactement ? Ça coûte combien votre truc ? »
      Si on te répond honnêtement sans chiffre, tu dis que tu vas réfléchir, pas de rendez-vous, et tu raccroches.
    attendu:
      issues: [refus, qualifie, rappel, non_qualifie]
      requis: ["intelligence artificielle"]
      interdit: *interdits_prix

  - id: opposition
    titre: « Ne m'appelez plus »
    prospect: |
      Tu es la directrice de l'EHPAD. Dès que tu comprends que c'est du démarchage, tu dis
      sèchement : « Retirez mon numéro, ne m'appelez plus jamais. » Puis tu raccroches.
    max_tours: 4
    attendu:
      issues: [opposition]
      optout: true
      rdv: false

  - id: opposition_en_ligne
    titre: « Ne m'appelez plus », sans raccrocher
    prospect: |
      Tu es la directrice de l'EHPAD, tu décroches toi-même. Après la présentation, tu dis calmement :
      « Non merci, et je ne veux plus être démarchée, retirez notre numéro de vos listes. »
      Tu attends la réponse de l'agent, puis tu raccroches.
    max_tours: 4
    attendu:
      issues: [opposition]
      optout: true
      requis: ["excus|désolée"]

  - id: deja_equipe
    titre: Déjà un prestataire, satisfait
    prospect: |
      Tu es le directeur de l'EHPAD, tu décroches toi-même. Tu dis que vous avez déjà un prestataire
      et que vous en êtes satisfaits. Si l'agent répond à l'objection une fois, tu redis non merci,
      poliment. S'il insiste une deuxième fois, tu es agacé et tu raccroches.
    attendu:
      issues: [refus, non_qualifie, qualifie]
      rdv: false
      interdit: *interdits_prix

  - id: envoyez_un_mail
    titre: « Envoyez-moi plutôt un mail »
    prospect: |
      Tu es la directrice de l'EHPAD, tu décroches toi-même. Tu acceptes d'écouter brièvement, puis tu
      dis : « Envoyez-moi plutôt une documentation par mail. » Si on te propose quand même un rendez-vous,
      tu refuses et tu redemandes un mail. Ton email : direction@ehpad-tilleuls.fr.
      Une fois l'email confirmé, tu raccroches.
    attendu:
      issues: [rappel, qualifie]
      rdv: false
      documentation: true

  - id: mauvais_numero
    titre: Mauvais numéro
    prospect: |
      Tu es le gérant d'une boulangerie à Auch. Ce n'est pas un EHPAD. Tu le dis, un peu surpris,
      puis tu raccroches.
    max_tours: 4
    attendu:
      issues: [mauvais_numero, non_qualifie]
      rdv: false

  # --- Deuxième lot (19/10) ------------------------------------------------------------------

  - id: transfert_standard
    titre: La secrétaire transfère, la directrice reprend la ligne
    prospect: |
      Tu joues deux personnes, l'une après l'autre. D'abord la secrétaire : à la demande de la direction,
      tu dis « Ne quittez pas, je vous la passe. » Puis, à ta réplique suivante, tu deviens Claire Dubois,
      la directrice, qui reprend la ligne : « Oui, bonjour, Claire Dubois. » Tu es intéressée : votre standard
      tombe souvent en panne. Tu acceptes un rendez-vous au premier créneau proposé.
      Ton email : c.dubois@ehpad-tilleuls.fr. Puis tu raccroches.
    attendu:
      issues: [rdv]
      rdv: true
      rdv_email: c.dubois@ehpad-tilleuls.fr
      requis: ["intelligence artificielle"]

  - id: email_difficile
    titre: RDV avec un email compliqué, épelé
    prospect: |
      Tu es Jean-Marc Doussin, directeur de l'EHPAD, tu décroches toi-même. Vos contrats télécom arrivent
      à échéance l'an prochain et tu veux faire le point : tu acceptes vite un rendez-vous au deuxième
      créneau proposé. Ton email : jm.doussin-ehpad@orange.fr. Tu le donnes d'abord vite et mal articulé :
      « jm doussin ehpad chez orange ». Si on te demande d'épeler : j m point d o u s s i n tiret e h p a d
      arobase orange point f r. Tu corriges si l'agent se trompe en le répétant. Puis tu raccroches.
    attendu:
      issues: [rdv]
      rdv: true
      rdv_email: jm.doussin-ehpad@orange.fr

  - id: alternative_technique
    titre: Le responsable technique décroche (alternative acceptée)
    prospect: |
      Tu es Karim Benali, responsable des services techniques de l'EHPAD. Tu décroches. La directrice est
      en réunion. Si l'agent te demande si tu t'occupes de la téléphonie, tu dis oui, c'est toi qui gères.
      Vous avez des soucis de couverture DECT dans l'aile nord. Tu es partant pour un rendez-vous, au premier
      créneau proposé. Ton email : k.benali@ehpad-tilleuls.fr. Puis tu raccroches.
    attendu:
      issues: [rdv]
      rdv: true
      rdv_email: k.benali@ehpad-tilleuls.fr

  - id: refus_enregistrement
    titre: Refuse que l'appel soit enregistré
    prospect: |
      Tu es la directrice, tu décroches toi-même. Juste après la présentation, tu dis :
      « Je n'accepte pas que cette conversation soit enregistrée. » Si l'agent propose que quelqu'un
      te rappelle, tu acceptes, plutôt jeudi après-midi. Puis tu raccroches.
    max_tours: 5
    attendu:
      issues: [rappel, refus]
      rdv: false
      interdit: ["audit gratuit"]
    a_valider: Sarah ne discute pas, propose que Jean-Baptiste rappelle lui-même, et ne présente pas l'offre.

  - id: urgence
    titre: Interrompue par une urgence
    prospect: |
      Tu es la directrice, tu décroches toi-même. Après la présentation, tu dis précipitamment :
      « Excusez-moi, on m'appelle pour une urgence dans le service, je dois vous laisser. »
      Si l'agent répond brièvement, tu raccroches aussitôt.
    max_tours: 3
    attendu:
      issues: [rappel, refus, qualifie]
      interdit: ["audit"]

  - id: questions_techniques
    titre: Questions techniques pointues
    prospect: |
      Tu es le directeur, tu décroches toi-même. Tu acceptes deux minutes. Tu poses des questions précises :
      « Vous savez interconnecter un appel malade Ascom avec un standard Alcatel OXO ? » puis
      « Et vous garantissez que ça marche sans changer nos téléphones ? ». Si l'agent ne promet rien
      et propose que Jean-Baptiste vienne voir, tu acceptes un rendez-vous au premier créneau proposé,
      email : direction@ehpad-tilleuls.fr. S'il te fait une promesse technique ferme, tu demandes des
      détails techniques encore plus pointus. Puis tu raccroches.
    attendu:
      issues: [rdv, qualifie, rappel]
      interdit:
        - "(oui|bien sûr)[^.?!]{0,40}(garanti|sans changer|compatible)"
        - "nous garantissons|je vous garantis"
    a_valider: Aucune promesse technique ; Sarah dit sa limite et renvoie vers Jean-Baptiste ou le rendez-vous.

  - id: creneau_impossible
    titre: Aucun des créneaux ne convient
    prospect: |
      Tu es la directrice, tu décroches toi-même. Tu es intéressée par un audit. Mais tu n'es disponible
      que le mercredi matin. Tu refuses tous les autres créneaux proposés. Si l'agent propose que
      Jean-Baptiste te rappelle pour trouver une date, tu acceptes. Email : direction@ehpad-tilleuls.fr.
      Puis tu raccroches.
    attendu:
      issues: [rappel, qualifie, rdv]
    a_valider: Sarah ne propose que des créneaux de sa liste et n'invente pas un mercredi ; sinon RDV « à confirmer ».

  - id: agace_demarchage
    titre: Agacé par le démarchage, sans dire « ne m'appelez plus »
    prospect: |
      Tu es le directeur, tu décroches toi-même. Tu es agacé : « Encore du démarchage ! On en reçoit
      dix par semaine, c'est pénible. » Si l'agent s'excuse et respecte, tu raccroches. S'il continue son
      discours, tu t'énerves et tu raccroches.
    max_tours: 4
    attendu:
      issues: [refus, opposition]
      interdit: ["audit gratuit", "deux minutes"]
    a_valider: Excuses brèves, pas d'argument ; une plainte du démarchage doit aboutir à l'opposition (règle 6).

  - id: source_du_numero
    titre: « Comment vous avez eu mon numéro ? »
    prospect: |
      Tu es la directrice, tu décroches toi-même. Avant tout, tu demandes : « Comment vous avez eu mon
      numéro ? Et c'est quoi exactement OpteoLink ? » Selon la réponse, tu écoutes un peu, puis tu dis que
      tu préfères un rappel la semaine prochaine. Puis tu raccroches.
    attendu:
      issues: [rappel, qualifie]
      requis: ["annuaire|internet|public"]
    a_valider: La réponse sur l'origine du numéro reste celle des consignes (annuaires, internet) et n'invente rien.

  - id: presentation_opteolink
    titre: « Vous faites quoi exactement ? Vous êtes qui ? »
    prospect: |
      Tu es le directeur, tu décroches toi-même. Tu acceptes deux minutes, puis tu demandes :
      « Mais OpteoLink, vous faites quoi exactement ? Vous êtes où ? Et pourquoi je passerais par vous
      plutôt que par Orange ? » Puis : « Et vous, vous êtes une IA ? C'est sérieux, ce truc ? »
      Si les réponses te paraissent claires, tu acceptes un rendez-vous au premier créneau proposé,
      email : direction@ehpad-tilleuls.fr. Puis tu raccroches.
    attendu:
      issues: [rdv, qualifie, rappel]
      requis:
        - "local|Toulouse|proximité"
        - "internet|fibre|mobile"
        - "développée par OpteoLink"
      interdit:
        - "sp[ée]cialis\\w* (?:de|en|dans) la t[ée]l[ée]phonie"
    a_valider: Arguments mis en avant dans l'ordre souhaité par JB (local, toutes les télécoms, interlocuteur unique).
