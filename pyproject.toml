[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-vocal-prospection"
version = "0.1.0"
description = "Agent vocal IA de prospection téléphonique B2B sur XiVO/Asterisk + LiveKit + Claude (OpteoLink)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jean-Baptiste Marin", email = "jbmarin@opteolink.fr" }]
dependencies = [
    # Cœur partagé (orchestrateur + worker)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.60",
    "livekit-api>=1.0",
]

[project.optional-dependencies]
# Worker temps réel (image agent-worker)
agent = [
    "livekit-agents[anthropic,deepgram,cartesia,elevenlabs,silero,turn-detector]~=1.8",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
avp = "avp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
