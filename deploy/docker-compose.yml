# Pile agent vocal de prospection OpteoLink.
#
# Utilisation (depuis le dossier deploy/) :
#   ./render-config.sh                 # génère rendered/livekit.yaml, rendered/sip.yaml (à partir de ../.env)
#   docker compose up -d --build       # construit les images et démarre tout
#   ./healthcheck.sh                   # vérifie redis, livekit, sip, worker
#   docker compose logs -f sip agent-worker
#
# Tous les services sont en `network_mode: host` : SIP/RTP (plages de ports UDP larges) et WebRTC
# ne passent pas bien par le NAT de Docker, et tout le trafic interne se fait sur 127.0.0.1.
# Le pare-feu (nftables, voir nftables.conf.tmpl) filtre l'accès depuis l'extérieur.
#
# Images : figer les versions après une installation validée (remplacer :latest par le tag ou le digest
# affiché par `docker image ls --digests`).

name: avp

x-app-common: &app-common
  network_mode: host
  env_file: ../.env
  environment:
    # Chemins dans le conteneur (prioritaires sur .env)
    DATA_DIR: /app/data
    CAMPAIGNS_DIR: /app/campaigns
    PROMPTS_DIR: /app/prompts
    TZ: Europe/Paris
  # UID/GID propriétaires de ../data (écrits dans deploy/.env par install.sh ; 1000 par défaut).
  user: "${AVP_UID:-1000}:${AVP_GID:-1000}"
  volumes:
    - ../data:/app/data
    # Montés en lecture seule : on modifie campagnes et prompts sans reconstruire l'image
    # (un redémarrage du conteneur suffit, voire rien selon la brique concernée).
    - ../campaigns:/app/campaigns:ro
    - ../prompts:/app/prompts:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--protected-mode", "yes",
              "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./rendered/livekit.yaml:/etc/livekit/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # GET / sur le port 7880 → "OK" quand le nœud est prêt (image alpine : wget busybox)
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7880/ | grep -q OK"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  sip:
    image: livekit/sip:latest
    network_mode: host
    # L'ENTRYPOINT de l'image lit /sip/config.yaml (--config) ; SIP_CONFIG_FILE est renseigné par cohérence.
    environment:
      SIP_CONFIG_FILE: /sip/config.yaml
    volumes:
      - ./rendered/sip.yaml:/sip/config.yaml:ro
    # Pas de NET_ADMIN : livekit-sip n'en a pas besoin (aucune manipulation réseau dans les sources).
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # health_port de sip.yaml (8090 ; si SIP_HEALTH_PORT est changé dans .env, adapter ici) répond 200 si prêt.
      # L'image debian-slim n'a ni curl ni wget : requête HTTP en bash pur.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  agent-worker:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent-worker
    image: avp/agent-worker:local
    command: ["python", "-m", "avp.agent.worker", "start"]
    depends_on:
      livekit:
        condition: service_healthy
      sip:
        condition: service_healthy
    # Laisse le temps aux appels en cours de se terminer proprement (durée max d'appel : 6 min).
    stop_grace_period: 7m
    healthcheck:
      # Serveur HTTP du worker LiveKit Agents (port 8081 en production) : 200 "OK" si connecté à LiveKit.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  orchestrator:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: orchestrator
    image: avp/orchestrator:local
    command: ["avp", "run"]
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      # La base SQLite partagée est lisible (avp run l'initialise au démarrage).
      test: ["CMD", "python", "-c",
             "import sqlite3; sqlite3.connect('file:/app/data/avp.db?mode=ro', uri=True).execute('select 1 from meta')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
